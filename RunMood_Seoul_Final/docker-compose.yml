services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: runmood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: runmood
      POSTGRES_USER: runmood
      POSTGRES_PASSWORD: runmood
    ports:
      - "5432:5432"
    volumes:
      - runmood_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runmood -d runmood"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  runmood_pgdata:
